<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="HTML Recap & Advanced">
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/media.css">
    <title>Day 15</title>
</head>

<body>
    <main class="container vh-100 d-flex justify-content-center align-items-center">
        <div class="to-do-container rounded-3 d-flex flex-column justify-content-center text-center gap-2 bg-white p-3">
            <div class="to-do-header mt-3 mb-2">
                <h1>My To-Do List</h1>
            </div>
            <div class="to-do-body">
                <div class="to-do-inputs d-flex gap-2 mx-2">
                    <input type="text" name="task" id="to-do-input" class="form-control"
                        placeholder="Add a new task...">
                    <button type="button" id="add-task-btn" class="btn btn-primary px-4">
                        Add
                    </button>
                </div>
            </div>
            <div class="to-do-footer">
                <div class="cards-container d-flex flex-column px-2 gap-2">

                </div>
            </div>
        </div>
    </main>
    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
    <script src="./js/bootstrap.bundle.min.js"></script>
    <script src="./js/index.js"></script>
</body>

</html>
